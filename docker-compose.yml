# Local 3-node Hermes cluster + dashboard.
#   docker compose up --build
# REST APIs on localhost:8081-8083, dashboard on localhost:3000.
# NEXT_PUBLIC_BROKERS points at the host-mapped ports because the browser
# (not the dashboard container) makes the API calls.

x-broker: &broker
  build: .
  restart: unless-stopped
  environment: &broker-env
    HERMES_MEMBERS: 1@broker-1:9091,2@broker-2:9091,3@broker-3:9091
    HERMES_CLUSTER_SECRET: ${HERMES_CLUSTER_SECRET:-change-me-in-prod}

services:
  broker-1:
    <<: *broker
    environment:
      <<: *broker-env
      HERMES_BROKER_ID: "1"
    ports: ["8081:8081"]
    volumes: ["hermes-data-1:/opt/hermes/data"]

  broker-2:
    <<: *broker
    environment:
      <<: *broker-env
      HERMES_BROKER_ID: "2"
    ports: ["8082:8081"]
    volumes: ["hermes-data-2:/opt/hermes/data"]

  broker-3:
    <<: *broker
    environment:
      <<: *broker-env
      HERMES_BROKER_ID: "3"
    ports: ["8083:8081"]
    volumes: ["hermes-data-3:/opt/hermes/data"]

  dashboard:
    build:
      context: dashboard
      args:
        NEXT_PUBLIC_BROKERS: http://localhost:8081,http://localhost:8082,http://localhost:8083
    ports: ["3000:3000"]
    depends_on: [broker-1, broker-2, broker-3]

volumes:
  hermes-data-1:
  hermes-data-2:
  hermes-data-3:
